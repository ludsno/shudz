<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-width: 260px;
        width: 100%;
        max-width: 420px;
        margin: 0;
        padding: 10px 8px 8px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        font-size: 13px;
        background-color: var(--bg);
        color: var(--text);
        user-select: none;
      }

      .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 8px 8px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }

      .popup-title {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .tab-notice {
        display: none;
        margin: 4px 8px 6px;
        padding: 6px 8px;
        border-radius: 6px;
        background-color: var(--seg-bg);
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .tab-notice.is-visible {
        display: block;
      }

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.12s ease;
      }

      .setting-row:hover {
        background-color: var(--row-hover);
      }

      .setting-row.static-row {
        cursor: default;
      }

      .setting-row.static-row:hover {
        background-color: transparent;
      }

      .setting-label {
        font-size: 13px;
        line-height: 1.3;
        color: var(--text);
        min-width: 0;
      }

      .divider {
        height: 1px;
        background-color: var(--border);
        margin: 4px 8px;
      }

      .secondary-controls {
        transition: opacity 0.15s ease;
      }

      .secondary-controls.is-disabled {
        opacity: 0.45;
        pointer-events: none;
      }

      .segmented {
        display: inline-flex;
        padding: 2px;
        border-radius: 6px;
        background-color: var(--seg-bg);
        gap: 2px;
      }

      .segmented button {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 11px;
        font-weight: 500;
        padding: 3px 7px;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .segmented button[aria-pressed="true"] {
        background-color: var(--seg-active);
        color: var(--text);
        box-shadow: var(--seg-shadow);
      }

      .segmented button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .popup-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px 2px;
        margin-top: 4px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-muted);
      }

      .footer-link {
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.12s ease;
      }

      .footer-link:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .action-btn {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.12s ease, opacity 0.12s ease;
      }

      .action-btn:hover:not(:disabled) {
        background-color: var(--row-hover);
      }

      .action-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .action-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <header class="popup-header">
      <h1 class="popup-title">Shudz</h1>
      <button type="button" class="action-btn" id="openLibraryBtn">
        Saved words
      </button>
    </header>

    <div class="tab-notice" id="tabNotice">
      Page overlay is unavailable on browser internal pages.
    </div>

    <label class="setting-row" for="masterToggle">
      <span class="setting-label">Extension enabled</span>
      <span class="switch">
        <input type="checkbox" id="masterToggle" />
        <span class="slider"></span>
      </span>
    </label>

    <div class="divider"></div>

    <div class="secondary-controls" id="secondaryControls">
      <label class="setting-row" for="pinyinToggle">
        <span class="setting-label">Pinyin overlay</span>
        <span class="switch">
          <input type="checkbox" id="pinyinToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="segmentationToggle">
        <span class="setting-label">Word segmentation</span>
        <span class="switch">
          <input type="checkbox" id="segmentationToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="dictionaryToggle">
        <span class="setting-label">Dictionary definitions</span>
        <span class="switch">
          <input type="checkbox" id="dictionaryToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="autoDetectToggle">
        <span class="setting-label">Auto-activate on Chinese pages</span>
        <span class="switch">
          <input type="checkbox" id="autoDetectToggle" />
          <span class="slider"></span>
        </span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="setting-row static-row">
      <span class="setting-label">Theme</span>
      <div class="segmented" role="group" aria-label="Theme">
        <button type="button" data-theme-value="auto" aria-pressed="true">
          Auto
        </button>
        <button type="button" data-theme-value="light" aria-pressed="false">
          Light
        </button>
        <button type="button" data-theme-value="dark" aria-pressed="false">
          Dark
        </button>
      </div>
    </div>

    <div class="setting-row static-row">
      <span class="setting-label">Dictionary cache</span>
      <button type="button" class="action-btn" id="clearCacheBtn">
        Clear
      </button>
    </div>

    <footer class="popup-footer">
      <span id="versionText"></span>
      <a
        class="footer-link"
        href="https://github.com/ludsno/shudz"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub ↗
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
