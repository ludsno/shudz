<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <h1 class="popup-title">Shudz</h1>
      <button type="button" class="action-btn" id="openLibraryBtn">
        Saved words
      </button>
    </header>

    <div class="tab-notice" id="tabNotice">
      Page overlay is unavailable on browser internal pages.
    </div>

    <label class="setting-row" for="masterToggle">
      <span class="setting-label">Extension enabled</span>
      <span class="switch">
        <input type="checkbox" id="masterToggle" />
        <span class="slider"></span>
      </span>
    </label>

    <div class="divider"></div>

    <div class="secondary-controls" id="secondaryControls">
      <label class="setting-row" for="pinyinToggle">
        <span class="setting-label">Pinyin overlay</span>
        <span class="switch">
          <input type="checkbox" id="pinyinToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="segmentationToggle">
        <span class="setting-label">Word segmentation</span>
        <span class="switch">
          <input type="checkbox" id="segmentationToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="dictionaryToggle">
        <span class="setting-label">Dictionary definitions</span>
        <span class="switch">
          <input type="checkbox" id="dictionaryToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="autoDetectToggle">
        <span class="setting-label">Auto-activate on Chinese pages</span>
        <span class="switch">
          <input type="checkbox" id="autoDetectToggle" />
          <span class="slider"></span>
        </span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="setting-row static-row">
      <span class="setting-label">Theme</span>
      <div class="segmented" role="group" aria-label="Theme">
        <button type="button" data-theme-value="auto" aria-pressed="true">
          Auto
        </button>
        <button type="button" data-theme-value="light" aria-pressed="false">
          Light
        </button>
        <button type="button" data-theme-value="dark" aria-pressed="false">
          Dark
        </button>
      </div>
    </div>

    <div class="setting-row static-row">
      <span class="setting-label">Dictionary cache</span>
      <button type="button" class="action-btn" id="clearCacheBtn">
        Clear
      </button>
    </div>

    <footer class="popup-footer">
      <span id="versionText"></span>
      <a
        class="footer-link"
        href="https://github.com/ludsno/shudz"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub ↗
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
