<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1f1f1f;
        --text-muted: #5f6368;
        --border: rgba(0, 0, 0, 0.1);
        --row-hover: rgba(0, 0, 0, 0.04);
        --switch-bg: #8e918f;
        --switch-knob: #ffffff;
        --accent: #0b57d0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --text: #e8eaed;
          --text-muted: #9aa0a6;
          --border: rgba(255, 255, 255, 0.12);
          --row-hover: rgba(255, 255, 255, 0.06);
          --switch-bg: #5f6368;
          --switch-knob: #202124;
          --accent: #8ab4f8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 248px;
        margin: 0;
        padding: 10px 8px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        font-size: 13px;
        background-color: var(--bg);
        color: var(--text);
        user-select: none;
      }

      .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 8px 8px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }

      .popup-title {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.12s ease;
      }

      .setting-row:hover {
        background-color: var(--row-hover);
      }

      .setting-label {
        font-size: 13px;
        line-height: 1.3;
        color: var(--text);
      }

      .divider {
        height: 1px;
        background-color: var(--border);
        margin: 4px 8px;
      }

      .secondary-controls {
        transition: opacity 0.15s ease;
      }

      .secondary-controls.is-disabled {
        opacity: 0.45;
        pointer-events: none;
      }

      .switch {
        position: relative;
        display: inline-block;
        flex-shrink: 0;
        width: 32px;
        height: 18px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
        margin: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background-color: var(--switch-bg);
        border-radius: 999px;
        transition: background-color 0.18s ease;
      }

      .slider::before {
        content: "";
        position: absolute;
        height: 14px;
        width: 14px;
        left: 2px;
        top: 2px;
        background-color: var(--switch-knob);
        border-radius: 50%;
        transition: transform 0.18s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }

      input:checked + .slider {
        background-color: var(--accent);
      }

      input:checked + .slider::before {
        transform: translateX(14px);
      }

      input:focus-visible + .slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header class="popup-header">
      <h1 class="popup-title">Shudz</h1>
    </header>

    <label class="setting-row" for="masterToggle">
      <span class="setting-label">Extension enabled</span>
      <span class="switch">
        <input type="checkbox" id="masterToggle" />
        <span class="slider"></span>
      </span>
    </label>

    <div class="divider"></div>

    <div class="secondary-controls" id="secondaryControls">
      <label class="setting-row" for="pinyinToggle">
        <span class="setting-label">Pinyin overlay</span>
        <span class="switch">
          <input type="checkbox" id="pinyinToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="segmentationToggle">
        <span class="setting-label">Word segmentation</span>
        <span class="switch">
          <input type="checkbox" id="segmentationToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="dictionaryToggle">
        <span class="setting-label">Dictionary definitions</span>
        <span class="switch">
          <input type="checkbox" id="dictionaryToggle" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="setting-row" for="autoDetectToggle">
        <span class="setting-label">Auto-activate on Chinese pages</span>
        <span class="switch">
          <input type="checkbox" id="autoDetectToggle" />
          <span class="slider"></span>
        </span>
      </label>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
